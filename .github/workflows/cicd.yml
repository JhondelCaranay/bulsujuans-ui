name: Deploy React Application
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t jhondel/bulsujuans-frontend-app:latest \
            --build-arg NODE_ENV=production \
            --build-arg NEXT_PUBLIC_BACKEND_URL='${{ secrets.NEXT_PUBLIC_BACKEND_URL }}' \
            --build-arg NEXT_PUBLIC_SOCKET_URL='${{ secrets.NEXT_PUBLIC_SOCKET_URL }}' \
            .

      - name: Publish Image to docker hub
        run: docker push jhondel/bulsujuans-frontend-app:latest
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Delete old container
        run: docker rm -f bulsujuans-frontend-app-container || true

      - name: Clean unused Docker images
        run: docker image prune -af

      - name: Pull image from docker hub
        run: docker pull jhondel/bulsujuans-frontend-app:latest

      - name: Start frontend with Docker Compose
        run: docker-compose up -d

      # - name: Delete old container
      #   run: docker rm -f bulsujuans-frontend-app-container

      # - name: Run Docker Container
      #   run: docker run -d -p 3000:80 --name bulsujuans-frontend-app-container jhondel/bulsujuans-frontend-app
